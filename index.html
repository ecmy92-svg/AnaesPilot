  <script>
    (function () {
      "use strict";

      const { useState, useEffect, useMemo, useCallback } = React;

      // =========================================================================
      // 1. DEFAULT PATIENT & DETERMINISTIC PATIENT PARAMETER ENGINE
      // =========================================================================
      const DEFAULT_PATIENT = {
        ageYears: 38,
        ageMonthsRemainder: 0,
        dob: "",
        sex: "female", // 'male' | 'female'
        weightKg: 72,
        heightCm: 168,
        asa: "II",
        isEmergency: false,
        allergies: "NKDA",
        comorbidities: [],
        isPregnant: false,
        gestationalWeeks: 38,
        gestationalDays: 4,
        gaAtBirthWeeks: 40,
        isPremature: false,
        renalImpairment: "none", // 'none' | 'mild_mod' | 'severe_esrd'
        hepaticImpairment: "none", // 'none' | 'mild_mod' | 'severe'
        clinicalNotes: ""
      };

      const COMORBIDITY_OPTIONS = [
        "Hypertension",
        "Type 2 DM",
        "OSA / High Mallampati",
        "IHD / CHF",
        "Asthma / COPD",
        "GORD / Full Stomach Risk",
        "Anticoagulated",
        "Prior Difficult Airway"
      ];

      /**
       * Computes age details from DOB or explicit ageYears/ageMonthsRemainder.
       * Identifies paediatric age category: Neonate, Infant, Toddler, Preschool,
       * School-age child, Adolescent, or Adult.
       */
      function computeAgeDetails(patient) {
        let totalMonths = 0;
        let years = Number(patient.ageYears);
        let monthsRem = Number(patient.ageMonthsRemainder || 0);

        if (patient.dob) {
          const birth = new Date(patient.dob + "T00:00:00");
          const now = new Date();
          if (!isNaN(birth.getTime()) && birth <= now) {
            let yDiff = now.getFullYear() - birth.getFullYear();
            let mDiff = now.getMonth() - birth.getMonth();
            let dDiff = now.getDate() - birth.getDate();
            if (dDiff < 0) mDiff -= 1;
            if (mDiff < 0) {
              yDiff -= 1;
              mDiff += 12;
            }
            years = Math.max(0, yDiff);
            monthsRem = Math.max(0, mDiff);
            totalMonths = years * 12 + monthsRem;
          } else {
            totalMonths = Math.max(0, Math.round((isNaN(years) ? 0 : years) * 12 + monthsRem));
          }
        } else {
          years = isNaN(years) ? 0 : Math.max(0, years);
          monthsRem = isNaN(monthsRem) ? 0 : Math.max(0, monthsRem);
          totalMonths = Math.round(years * 12 + monthsRem);
          years = Math.floor(totalMonths / 12);
          monthsRem = totalMonths % 12;
        }

        const ageDecimalYears = totalMonths / 12;
        let category = "Adult";
        let isPaediatric = false;
        let isNeonate = false;
        let isInfant = false;

        if (ageDecimalYears < 18) {
          isPaediatric = true;
          if (totalMonths <= 1) {
            category = "Neonate";
            isNeonate = true;
          } else if (totalMonths < 12) {
            category = "Infant";
            isInfant = true;
          } else if (ageDecimalYears < 3) {
            category = "Toddler";
          } else if (ageDecimalYears < 6) {
            category = "Preschool";
          } else if (ageDecimalYears < 12) {
            category = "School-age child";
          } else {
            category = "Adolescent";
          }
        }

        return {
          years,
          monthsRemainder: monthsRem,
          totalMonths,
          ageDecimalYears,
          category,
          isPaediatric,
          isNeonate,
          isInfant
        };
      }

      /**
       * Core deterministic Patient Parameter Engine.
       * Calculates BMI, IBW (Devine), PBW (ARDSNet / McLaren-Krauss / paediatric),
       * LBW (Janmahasatian / Peters), AdjBW, warnings, and scalar map.
       */
      function calculatePatientMetrics(patient) {
        const age = computeAgeDetails(patient);
        const tbw = Math.max(0.5, Number(patient.weightKg) || 0);
        const heightCm = Math.max(30, Number(patient.heightCm) || 0);
        const heightM = heightCm / 100;
        const bmi = tbw / (heightM * heightM);

        const warnings = [];
        const flags = [];

        if (!patient.weightKg || patient.weightKg <= 0) {
          warnings.push("Missing or invalid weight (kg) — deterministic doses require verified weight.");
        }
        if (!patient.heightCm || patient.heightCm <= 0) {
          warnings.push("Missing or invalid height (cm) — BMI, IBW, PBW, and LBW require height.");
        }
        if (age.isNeonate) {
          flags.push("NEONATE: Use neonatal-specific dosing & airway rules; avoid standard adult/child defaults.");
        } else if (age.isInfant) {
          flags.push("INFANT (<1 yr): Increased extracellular fluid & Vd; strict max dose & airway vigilance.");
        }
        if (age.isPaediatric && patient.isPremature) {
          flags.push(`PREMATURITY HISTORY (GA at birth ${patient.gaAtBirthWeeks || "?"} wk): Apnoea risk up to 50–60 wk postmenstrual age.`);
        }
        if (patient.isPregnant) {
          flags.push(`PREGNANT (GA ${patient.gestationalWeeks || "?"}w+${patient.gestationalDays || 0}d): Left uterine displacement, reduced FRC, aspiration precautions; maternal weight ≠ linear spinal scalar.`);
        }
        if (bmi >= 35) {
          flags.push(`OBESITY (BMI ${bmi.toFixed(1)}): Use IBW / PBW / LBW / AdjBW scalars rather than TBW for lipophilic/polar agents.`);
        } else if (bmi >= 30) {
          flags.push(`CLASS I OBESITY (BMI ${bmi.toFixed(1)}): Adjusted Body Weight & LBW scalars active where validated.`);
        }
        if (patient.renalImpairment !== "none") {
          flags.push(`RENAL (${patient.renalImpairment === "severe_esrd" ? "Severe / ESRD" : "Mild–Mod"}): Caution with renally cleared opioids/NMBs/sugammadex.`);
        }
        if (patient.hepaticImpairment !== "none") {
          flags.push(`HEPATIC (${patient.hepaticImpairment === "severe" ? "Severe" : "Mild–Mod"}): Altered protein binding & metabolism.`);
        }
        if (patient.allergies && patient.allergies.trim().toUpperCase() !== "NKDA" && patient.allergies.trim() !== "") {
          flags.push(`ALLERGY: ${patient.allergies.trim()}`);
        }

        // Ideal Body Weight (Devine formula for adults; height-based estimate for paediatrics)
        let ibw = tbw;
        let ibwFormula = "TBW (Paediatric / fallback)";
        if (!age.isPaediatric) {
          const heightInches = heightCm / 2.54;
          const over5Ft = Math.max(0, heightInches - 60);
          ibw = patient.sex === "male" ? 50 + 2.3 * over5Ft : 45.5 + 2.3 * over5Ft;
          ibw = Math.max(35, ibw);
          ibwFormula = patient.sex === "male"
            ? "Devine Male: 50 + 2.3 × (height_in − 60)"
            : "Devine Female: 45.5 + 2.3 × (height_in − 60)";
        } else {
          // McLaren / Traub-Kichen / BMI-50th reference approximation
          ibw = tbw;
          ibwFormula = "Paediatric weight-based reference (TBW)";
        }

        // Predicted Body Weight (ARDSNet for adults; height-derived for paediatrics)
        let pbw = ibw;
        let pbwFormula = ibwFormula;
        if (!age.isPaediatric) {
          pbw = patient.sex === "male"
            ? 50 + 0.91 * (heightCm - 152.4)
            : 45.5 + 0.91 * (heightCm - 152.4);
          pbw = Math.max(30, pbw);
          pbwFormula = patient.sex === "male"
            ? "ARDSNet Male: 50 + 0.91 × (ht_cm − 152.4)"
            : "ARDSNet Female: 45.5 + 0.91 × (ht_cm − 152.4)";
        } else {
          // Paediatric PBW estimate from height (cm): (ht_cm^2 * 1.65) / 1000 for children > 40 cm
          pbw = Math.max(1.5, (heightCm * heightCm * 1.65) / 1000);
          pbwFormula = "Paediatric height-derived PBW: (ht_cm² × 1.65) / 1000";
        }

        // Lean Body Weight (Janmahasatian for adults; Peters for children)
        let lbw = tbw;
        let lbwFormula = "TBW";
        if (!age.isPaediatric && bmi > 0) {
          if (patient.sex === "male") {
            lbw = (9270 * tbw) / (6680 + 216 * bmi);
            lbwFormula = "Janmahasatian Male: (9270 × TBW) / (6680 + 216 × BMI)";
          } else {
            lbw = (9270 * tbw) / (8780 + 244 * bmi);
            lbwFormula = "Janmahasatian Female: (9270 × TBW) / (8780 + 244 × BMI)";
          }
        } else if (age.isPaediatric) {
          // Peters eLCV / LBW approximation
          const ecv = (0.0215 * Math.pow(tbw, 0.6469) * Math.pow(heightCm, 0.7236)) * 1000;
          lbw = Math.min(tbw, Math.max(1.2, ecv * 0.038 + tbw * 0.78));
          lbwFormula = "Paediatric lean mass approximation (height & weight scaled)";
        }

        // Adjusted Body Weight (when BMI >= 30 or TBW > 1.2 * IBW)
        const adjBw = ibw + 0.4 * (tbw - ibw);
        const adjBwFormula = "IBW + 0.4 × (TBW − IBW)";

        const scalars = {
          TBW: { value: tbw, label: "Total Body Weight (TBW)", formula: "Measured patient weight (kg)" },
          IBW: { value: ibw, label: "Ideal Body Weight (IBW)", formula: ibwFormula },
          PBW: { value: pbw, label: "Predicted Body Weight (PBW)", formula: pbwFormula },
          LBW: { value: lbw, label: "Lean Body Weight (LBW)", formula: lbwFormula },
          AdjBW: { value: adjBw, label: "Adjusted Body Weight (AdjBW)", formula: adjBwFormula }
        };

        return {
          age,
          tbw,
          heightCm,
          bmi,
          ibw,
          pbw,
          lbw,
          adjBw,
          scalars,
          flags,
          warnings
        };
      }

      function convertInfusionToMgPerHour(rateValue, unit, weightKg) {
        const val = Number(rateValue) || 0;
        const wt = Math.max(0.5, Number(weightKg) || 70);
        switch (unit) {
          case "mcg/kg/min":
            return (val * wt * 60) / 1000;
          case "mcg/kg/hr":
            return (val * wt) / 1000;
          case "mg/kg/hr":
            return val * wt;
          case "mg/hr":
            return val;
          case "mcg/min":
            return (val * 60) / 1000;
          default:
            return 0;
        }
      }

      /**
       * Airway Calculator (Adult & Paediatric)
       */
      function calculateAirway(patient, metrics) {
        const { age, tbw } = metrics;
        if (!age.isPaediatric) {
          const isMale = patient.sex === "male";
          return {
            isPaediatric: false,
            ettSize: isMale ? "7.5 – 8.0 mm ID (cuffed)" : "7.0 – 7.5 mm ID (cuffed)",
            ettDepthCm: isMale ? "21 – 23 cm at lips" : "20 – 22 cm at lips",
            lmaSize: isMale ? "Size 4 or 5" : "Size 3 or 4",
            oralAirway: isMale ? "Guedel Size 3 or 4 (90–100 mm)" : "Guedel Size 2 or 3 (80–90 mm)",
            checklist: [
              "Waveform capnography (EtCO2) calibrated & connected",
              "Direct/video laryngoscope + functioning blade & backup handle",
              "Cuffed ETT + stylet/bougie + 10 mL syringe to check cuff",
              "Suction working & positioned at head of bed",
              "SGA/LMA available as rescue airway device"
            ]
          };
        }

        // Paediatric airway formulas
        const yrs = age.ageDecimalYears;
        let uncuffedMm = 3.5;
        let cuffedMm = 3.0;
        let depthCm = 9.0;
        let lma = "Size 1";
        let oralAirway = "Size 00 / 0";
        let nasalAirway = "10–12 Fr";

        if (age.isNeonate) {
          uncuffedMm = tbw < 1.0 ? 2.5 : tbw < 2.0 ? 3.0 : 3.5;
          cuffedMm = 3.0;
          depthCm = Number((6 + tbw).toFixed(1));
          lma = "Size 1 (<5 kg)";
          oralAirway = "Size 000 / 00 (30–40 mm)";
          nasalAirway = "10–12 Fr";
        } else if (age.isInfant) {
          uncuffedMm = 3.5;
          cuffedMm = 3.0;
          depthCm = Number((10 + (yrs * 2)).toFixed(1));
          lma = tbw < 5 ? "Size 1" : "Size 1.5 (5–10 kg)";
          oralAirway = "Size 00 / 0 (40–50 mm)";
          nasalAirway = "12–14 Fr";
        } else {
          // Cole uncuffed: age/4 + 4; Khine cuffed: age/4 + 3.5; Depth: age/2 + 12
          uncuffedMm = Number((yrs / 4 + 4).toFixed(1));
          cuffedMm = Number((yrs / 4 + 3.5).toFixed(1));
          depthCm = Number((yrs / 2 + 12).toFixed(1));
          if (tbw < 20) {
            lma = "Size 2 (10–20 kg)";
            oralAirway = "Size 1 (60 mm)";
            nasalAirway = "14–16 Fr";
          } else if (tbw < 30) {
            lma = "Size 2.5 (20–30 kg)";
            oralAirway = "Size 1–2 (60–70 mm)";
            nasalAirway = "16–18 Fr";
          } else if (tbw < 50) {
            lma = "Size 3 (30–50 kg)";
            oralAirway = "Size 2 (70 mm)";
            nasalAirway = "18–20 Fr";
          } else {
            lma = "Size 4 (50–70 kg)";
            oralAirway = "Size 3 (80 mm)";
            nasalAirway = "20–22 Fr";
          }
        }

        const adjSizes = (val) => [
          Math.max(2.5, Number((val - 0.5).toFixed(1))),
          Number(val.toFixed(1)),
          Number((val + 0.5).toFixed(1))
        ];

        return {
          isPaediatric: true,
          ageCategory: age.category,
          uncuffedRecommended: uncuffedMm,
          uncuffedAdjacent: adjSizes(uncuffedMm),
          cuffedRecommended: cuffedMm,
          cuffedAdjacent: adjSizes(cuffedMm),
          ettDepthCm: depthCm,
          lmaSize: lma,
          oralAirway,
          nasalAirway,
          difficultAirwayNote: "Paediatric Difficult Airway: Maintain spontaneous ventilation where possible; limit laryngoscopy attempts; early SGA rescue; call for senior/paediatric airway help.",
          checklist: [
            "Uncuffed & cuffed ETTs in recommended + ±0.5 mm sizes ready",
            "Age-appropriate laryngoscope blade (Miller straight for infants/neonates, Macintosh)",
            "Waveform capnography + pulse oximetry + suction + SGA rescue",
            "Atropine drawn up if infant/bradycardia risk during airway manipulation"
          ]
        };
      }

      /**
       * Ventilation & Oxygenation Calculator
       */
      function calculateVentilation(metrics, mode, ventInputs) {
        const { pbw, tbw, age } = metrics;
        const isPaed = mode === "paediatric" || (mode === "auto" && age.isPaediatric);

        let tvMlPerKg = 7;
        let tvBasisWeight = pbw;
        let tvBasisLabel = "PBW";
        let rrRange = "12 – 16 /min";
        let rrDefault = 14;
        let peepRange = "5 – 8 cmH2O";
        let modeNote = "Lung-protective ventilation targeting 6–8 mL/kg PBW.";

        if (isPaed) {
          tvMlPerKg = 6;
          tvBasisWeight = age.ageDecimalYears >= 2 ? pbw : tbw;
          tvBasisLabel = age.ageDecimalYears >= 2 ? "PBW" : "TBW";
          if (age.isNeonate) {
            rrRange = "30 – 50 /min";
            rrDefault = 40;
          } else if (age.isInfant) {
            rrRange = "25 – 35 /min";
            rrDefault = 30;
          } else if (age.ageDecimalYears < 6) {
            rrRange = "20 – 28 /min";
            rrDefault = 24;
          } else {
            rrRange = "14 – 22 /min";
            rrDefault = 18;
          }
          peepRange = "4 – 6 cmH2O";
          modeNote = "Paediatric protective ventilation: 6–8 mL/kg, avoid high plateau/driving pressures, titrate RR to EtCO2/PaCO2.";
        } else if (mode === "obesity") {
          tvMlPerKg = 6;
          tvBasisWeight = pbw;
          tvBasisLabel = "PBW (never TBW)";
          rrRange = "14 – 20 /min";
          rrDefault = 16;
          peepRange = "8 – 12 cmH2O (recruitment titrated)";
          modeNote = "Obesity ventilation: strictly base Tidal Volume on PBW; higher PEEP & recruitment manoeuvres to counteract atelectasis.";
        } else if (mode === "laparoscopic") {
          tvMlPerKg = 6.5;
          tvBasisWeight = pbw;
          tvBasisLabel = "PBW";
          rrRange = "14 – 20 /min";
          rrDefault = 16;
          peepRange = "5 – 10 cmH2O";
          modeNote = "Pneumoperitoneum / Trendelenburg increases peak airway pressures & CO2 load; increase minute ventilation via RR rather than excessive TV.";
        } else if (mode === "olv") {
          tvMlPerKg = 5;
          tvBasisWeight = pbw;
          tvBasisLabel = "PBW (One-Lung Ventilation)";
          rrRange = "14 – 22 /min";
          rrDefault = 18;
          peepRange = "5 – 8 cmH2O (dependent lung)";
          modeNote = "One-Lung Ventilation: target 4–6 mL/kg PBW, FiO2 titrated for SpO2, watch plateau pressure (<25–30 cmH2O).";
        }

        const targetTvMl = Math.round(tvBasisWeight * tvMlPerKg);
        const lowTvMl = Math.round(tvBasisWeight * (isPaed ? 6 : 6));
        const highTvMl = Math.round(tvBasisWeight * (isPaed ? 8 : 8));
        const rr = ventInputs.rr || rrDefault;
        const minuteVentilationLMin = Number(((targetTvMl * rr) / 1000).toFixed(2));

        // Oxygenation indices: Alveolar gas equation PAO2 = FiO2*(Patm - PH2O) - (PaCO2 / RQ)
        const fio2 = Math.min(1.0, Math.max(0.21, Number(ventInputs.fio2) || 0.4));
        const pao2 = Math.max(20, Number(ventInputs.pao2) || 120);
        const paco2 = Math.max(15, Number(ventInputs.paco2) || 40);
        const patm = Number(ventInputs.patm) || 760;
        const ph2o = 47;
        const rq = 0.8;

        const pao2Alveolar = fio2 * (patm - ph2o) - paco2 / rq;
        const aaGradient = Number((pao2Alveolar - pao2).toFixed(1));
        const pfRatio = Math.round(pao2 / fio2);

        return {
          tvBasisLabel,
          tvBasisWeight,
          targetTvMl,
          lowTvMl,
          highTvMl,
          rr,
          rrRange,
          minuteVentilationLMin,
          peepRange,
          modeNote,
          pao2Alveolar: Number(pao2Alveolar.toFixed(1)),
          aaGradient,
          pfRatio
        };
      }

      /**
       * Paediatric Fluid & Blood Volume Calculator
       */
      function calculatePaediatricFluids(metrics, protocol, fastingHours, bloodLossMl) {
        const { tbw, age } = metrics;
        const wt = Math.max(0.5, tbw);

        // Holliday-Segar 4-2-1 hourly maintenance
        let hollidayMlHr = 0;
        if (wt <= 10) {
          hollidayMlHr = wt * 4;
        } else if (wt <= 20) {
          hollidayMlHr = 40 + (wt - 10) * 2;
        } else {
          hollidayMlHr = 60 + (wt - 20) * 1;
        }

        const effectiveMaintMlHr =
          protocol === "balanced_isotonic"
            ? Number((hollidayMlHr * 0.65).toFixed(1)) // conservative/balanced isotonic maintenance reference
            : Number(hollidayMlHr.toFixed(1));

        const deficitMl = Number((hollidayMlHr * Math.max(0, Number(fastingHours) || 0)).toFixed(0));

        // Estimated Blood Volume (EBV) by age category (mL/kg)
        let ebvPerKg = 75;
        let ebvLabel = "Child / Adolescent (75 mL/kg)";
        if (age.isNeonate) {
          ebvPerKg = patientIsPretermOrLowWt(wt) ? 95 : 85;
          ebvLabel = age.isNeonate ? "Neonate (85–90 mL/kg)" : "Infant (80 mL/kg)";
        } else if (age.isInfant) {
          ebvPerKg = 80;
          ebvLabel = "Infant (80 mL/kg)";
        } else if (age.ageDecimalYears >= 12) {
          ebvPerKg = 70;
          ebvLabel = "Adolescent/Adult (70 mL/kg)";
        }

        const ebvMl = Math.round(wt * ebvPerKg);
        // Allowable Blood Loss (ABL) at starting Hct ~36% -> target Hct ~24% => ~1/3 EBV
        const ablMl = Math.round(ebvMl * 0.33);
        const urineTargetMlHr = Number((wt * (age.isInfant || age.isNeonate ? 1.5 : 1.0)).toFixed(1));
        const loss = Math.max(0, Number(bloodLossMl) || 0);
        const crystalloidReplacementMl = Math.round(loss * 1.5);

        return {
          hollidayMlHr: Number(hollidayMlHr.toFixed(1)),
          effectiveMaintMlHr,
          deficitMl,
          ebvPerKg,
          ebvLabel,
          ebvMl,
          ablMl,
          urineTargetMlHr,
          crystalloidReplacementMl
        };
      }

      function patientIsPretermOrLowWt(wt) {
        return wt < 2.5;
      }

      // =========================================================================
      // 6. AUTOMATED DETERMINISTIC UNIT TEST SUITE
      // =========================================================================
      function runDeterministicUnitTests() {
        const tests = [];

        // Test 1: BMI calculation
        const m1 = calculatePatientMetrics({ ...DEFAULT_PATIENT, weightKg: 80, heightCm: 160, ageYears: 40 });
        const expectedBmi = Number((80 / (1.6 * 1.6)).toFixed(2));
        tests.push({
          id: "T1",
          category: "Patient Engine",
          name: "BMI deterministic calculation (80 kg, 160 cm -> 31.25)",
          passed: Math.abs(m1.bmi - expectedBmi) < 0.01,
          detail: `Actual: ${m1.bmi.toFixed(2)} | Formula: weight / (height_m)^2`
        });

        // Test 2: Devine IBW male vs female
        const maleM = calculatePatientMetrics({ ...DEFAULT_PATIENT, sex: "male", heightCm: 177.8, weightKg: 75, ageYears: 35 });
        const expectedMaleIbw = 50 + 2.3 * (70 - 60); // 73 kg
        tests.push({
          id: "T2",
          category: "Patient Engine",
          name: "Devine IBW Male at 70 in (177.8 cm) = 73.0 kg",
          passed: Math.abs(maleM.ibw - expectedMaleIbw) < 0.1,
          detail: `Actual: ${maleM.ibw.toFixed(1)} kg | Expected: ${expectedMaleIbw.toFixed(1)} kg`
        });

        // Test 3: Paediatric age category detection (Neonate vs Infant vs Toddler)
        const neo = calculatePatientMetrics({ ...DEFAULT_PATIENT, ageYears: 0, ageMonthsRemainder: 1, weightKg: 3.4, heightCm: 50 });
        const tod = calculatePatientMetrics({ ...DEFAULT_PATIENT, ageYears: 2, ageMonthsRemainder: 4, weightKg: 13, heightCm: 88 });
        tests.push({
          id: "T3",
          category: "Paediatric Engine",
          name: "Paediatric age categorization (1 mo = Neonate, 28 mo = Toddler)",
          passed: neo.age.isNeonate && tod.age.category === "Toddler" && tod.age.totalMonths === 28,
          detail: `1m -> ${neo.age.category} (neonate=${neo.age.isNeonate}); 28m -> ${tod.age.category}`
        });

        // Test 4: Holliday-Segar 4-2-1 maintenance fluid (25 kg child = 40 + 20 + 5 = 65 mL/hr)
        const p25 = calculatePatientMetrics({ ...DEFAULT_PATIENT, ageYears: 7, weightKg: 25, heightCm: 120 });
        const fl25 = calculatePaediatricFluids(p25, "holliday_segar", 4, 0);
        tests.push({
          id: "T4",
          category: "Paediatric Fluids",
          name: "Holliday-Segar 4-2-1 for 25 kg child = 65 mL/hr & 260 mL 4h deficit",
          passed: fl25.hollidayMlHr === 65 && fl25.deficitMl === 260,
          detail: `Maint: ${fl25.hollidayMlHr} mL/hr | Deficit (4h): ${fl25.deficitMl} mL`
        });

        // Test 5: Infusion rate conversion (100 mcg/kg/min propofol on 70 kg = 420 mg/hr -> at 10 mg/mL = 42 mL/hr)
        const mgHr = convertInfusionToMgPerHour(100, "mcg/kg/min", 70);
        const mlHr = mgHr / 10;
        tests.push({
          id: "T5",
          category: "Infusion Engine",
          name: "100 mcg/kg/min × 70 kg = 420 mg/hr -> 42.0 mL/hr at 10 mg/mL",
          passed: Math.abs(mgHr - 420) < 0.001 && Math.abs(mlHr - 42) < 0.001,
          detail: `mg/hr: ${mgHr.toFixed(1)} | Pump rate: ${mlHr.toFixed(1)} mL/hr`
        });

        // Test 6: Ventilation PBW & Tidal Volume (70 kg male ARDSNet PBW = 50 + 0.91*(175-152.4) = 70.566 kg; 6 mL/kg = 423 mL)
        const ventM = calculatePatientMetrics({ ...DEFAULT_PATIENT, sex: "male", heightCm: 175, weightKg: 95, ageYears: 45 });
        const ventOut = calculateVentilation(ventM, "adult", { rr: 14, fio2: 0.4, pao2: 140, paco2: 40, patm: 760 });
        const expectedPbw = 50 + 0.91 * (175 - 152.4);
        tests.push({
          id: "T6",
          category: "Ventilation Engine",
          name: "ARDSNet PBW & 6 mL/kg TV uses PBW rather than 95 kg TBW",
          passed: Math.abs(ventM.pbw - expectedPbw) < 0.05 && ventOut.targetTvMl === Math.round(expectedPbw * 6),
          detail: `PBW: ${ventM.pbw.toFixed(1)} kg | 6 mL/kg TV: ${ventOut.targetTvMl} mL`
        });

        // Test 7: Paediatric ETT Cole uncuffed formula for 4-year-old (4/4 + 4 = 5.0 mm)
        const p4 = calculatePatientMetrics({ ...DEFAULT_PATIENT, ageYears: 4, ageMonthsRemainder: 0, weightKg: 16, heightCm: 102 });
        const aw4 = calculateAirway(p4, p4);
        tests.push({
          id: "T7",
          category: "Airway Engine",
          name: "Cole uncuffed ETT formula for 4-year-old = 5.0 mm ID",
          passed: aw4.isPaediatric && aw4.uncuffedRecommended === 5.0,
          detail: `Recommended uncuffed ETT: ${aw4.uncuffedRecommended} mm | Depth: ${aw4.ettDepthCm} cm`
        });

        // Test 8: Local Anaesthetic max mg & volume calculation (Lidocaine plain 4.5 mg/kg on 70 kg = 315 mg -> capped at 300 mg; at 1% = 10 mg/mL -> 30.0 mL)
        const lido = LOCAL_ANAESTHETICS.find((l) => l.id === "lidocaine");
        const rawMax = 70 * lido.plainMaxMgKg; // 315
        const cappedMax = Math.min(rawMax, lido.maxAbsoluteMg); // 300
        const maxVolMl = cappedMax / 10; // 30 mL
        tests.push({
          id: "T8",
          category: "Regional LA Engine",
          name: "Lidocaine plain max dose cap (315 mg -> capped at 300 mg; 30.0 mL at 1%)",
          passed: cappedMax === 300 && maxVolMl === 30,
          detail: `Raw: ${rawMax} mg -> Capped: ${cappedMax} mg (${maxVolMl.toFixed(1)} mL @ 10 mg/mL)`
        });

        return tests;
      }

      // =========================================================================
      // 9. MODULE A: GENERAL ANAESTHESIA

      function GeneralAnaesthesiaModule({ drugs, metrics, verifiedMap, onToggleVerify }) {
        const [subTab, setSubTab] = useState("A1");
        const [search, setSearch] = useState("");
        const [catFilter, setCatFilter] = useState("ALL");
        const [selectedDrugId, setSelectedDrugId] = useState("propofol_ind");
        const [customDosePerKg, setCustomDosePerKg] = useState(null);
        const [customConc, setCustomConc] = useState(null);

        // A2 Maintenance state
        const [maintDrugId, setMaintDrugId] = useState("propofol_inf");
        const [maintRate, setMaintRate] = useState(6.0);
        const [maintUnit, setMaintUnit] = useState("mg/kg/hr");
        const [maintConcMgMl, setMaintConcMgMl] = useState(10);
        const [tciModel, setTciModel] = useState("Marsh");

        // A3 Haemodynamic state
        const [hemoId, setHemoId] = useState("noradrenaline");
        const [hemoDose, setHemoDose] = useState(6);
        const [hemoConc, setHemoConc] = useState(80);

        // A5 Ventilation state
        const [ventMode, setVentMode] = useState("auto");
        const [ventInputs, setVentInputs] = useState({ rr: 14, fio2: 0.4, pao2: 140, paco2: 40, patm: 760 });

        const filteredDrugs = useMemo(() => {
          return drugs.filter((d) => {
            const matchesCat = catFilter === "ALL" || d.category.toLowerCase().includes(catFilter.toLowerCase());
            const matchesSearch =
              !search.trim() ||
              d.name.toLowerCase().includes(search.toLowerCase()) ||
              d.category.toLowerCase().includes(search.toLowerCase());
            return matchesCat && matchesSearch;
          });
        }, [drugs, search, catFilter]);

        const activeDrug = drugs.find((d) => d.id === selectedDrugId) || drugs[0];

        // Determine scalar & range for A1
        const isPaed = metrics.age.isPaediatric;
        const scalarKey =
          isPaed && activeDrug.paedScalar
            ? activeDrug.paedScalar
            : activeDrug.scalar || "TBW";
        const scalarObj = metrics.scalars[scalarKey] || metrics.scalars.TBW;
        const scalarWeight = scalarObj.value;

        const refMin = isPaed && activeDrug.paedRange ? activeDrug.paedRange.min : activeDrug.minDose;
        const refDefault =
          isPaed && activeDrug.paedRange
            ? metrics.age.isNeonate && activeDrug.paedRange.neonateDefault !== undefined
              ? activeDrug.paedRange.neonateDefault
              : activeDrug.paedRange.default
            : activeDrug.defaultDose;
        const refMax = isPaed && activeDrug.paedRange ? activeDrug.paedRange.max : activeDrug.maxDose;

        const effectiveDosePerKg = customDosePerKg !== null ? customDosePerKg : refDefault;
        const effectiveConc = customConc !== null ? customConc : activeDrug.concentrations[0] || 1;

        const rangeLowTotal = refMin * scalarWeight;
        const rangeHighTotal = refMax * scalarWeight;
        const rawSelectedTotal = effectiveDosePerKg * scalarWeight;
        const maxCap = activeDrug.maxTotalDose || Infinity;
        const exceedsMaxCap = rawSelectedTotal > maxCap;
        const calculatedTotal = Math.min(rawSelectedTotal, maxCap);
        const volumeMl = effectiveConc > 0 ? calculatedTotal / effectiveConc : 0;

        const selectDrug = (d) => {
          setSelectedDrugId(d.id);
          setCustomDosePerKg(null);
          setCustomConc(d.concentrations[0] || 1);
        };

        // A2 Maintenance calculations
        const maintDrug = MAINTENANCE_DRUGS.find((m) => m.id === maintDrugId) || MAINTENANCE_DRUGS[0];
        const maintScalar = metrics.scalars[maintDrug.scalar] || metrics.scalars.TBW;
        const mgPerHr = convertInfusionToMgPerHour(maintRate, maintUnit, maintScalar.value);
        const pumpMlHr = maintConcMgMl > 0 ? mgPerHr / maintConcMgMl : 0;

        // A3 Haemodynamic calculations
        const hemoDrug = HAEMODYNAMIC_DRUGS.find((h) => h.id === hemoId) || HAEMODYNAMIC_DRUGS[0];
        let hemoMlHr = 0;
        if (hemoDrug.id === "dobutamine") {
          hemoMlHr = hemoConc > 0 ? (hemoDose * metrics.tbw * 60) / hemoConc : 0;
        } else if (hemoDrug.id === "ephedrine") {
          hemoMlHr = hemoDose / 3; // mL bolus at 3 mg/mL
        } else {
          hemoMlHr = hemoConc > 0 ? (hemoDose * 60) / hemoConc : 0;
        }

        const airway = calculateAirway(
          { sex: metrics.age.isPaediatric ? "female" : "female" }, // passed via prop below
          metrics
        );

        return h(
          "div",
          { className: "space-y-4" },
          // Sub-module switcher
          h(
            "div",
            { className: "flex flex-wrap gap-2" },
            [

      // 11. MODULE C: PAEDIATRIC ANAESTHESIA
      // =========================================================================
      function PaediatricAnaesthesiaModule({ drugs, patient, onChangePatient, metrics, verifiedMap, onToggleVerify, onOpenEmergency }) {
        const [subTab, setSubTab] = useState("C2");
        const [paedDrugId, setPaedDrugId] = useState("propofol_ind");
        const [paedDoseOverride, setPaedDoseOverride] = useState(null);
        const [fluidProtocol, setFluidProtocol] = useState("holliday_segar");
        const [fastingHours, setFastingHours] = useState(4);
        const [bloodLossMl, setBloodLossMl] = useState(0);
        const [paedEmKey, setPaedEmKey] = useState("laryngospasm");

        const { age, tbw } = metrics;
        const selectedDrug = drugs.find((d) => d.id === paedDrugId) || drugs[0];
        const range = selectedDrug.paedRange || {
          min: selectedDrug.minDose,
          default: selectedDrug.defaultDose,
          max: selectedDrug.maxDose,
          neonateDefault: selectedDrug.minDose
        };
        const baseRefDose =
          age.isNeonate && range.neonateDefault !== undefined ? range.neonateDefault : range.default;
        const activeDosePerKg = paedDoseOverride !== null ? paedDoseOverride : baseRefDose;
        const rawTotal = activeDosePerKg * tbw;
        const maxCap = selectedDrug.maxTotalDose || Infinity;
        const overMax = rawTotal > maxCap;
        const finalTotal = Math.min(rawTotal, maxCap);
        const conc = selectedDrug.concentrations[0] || 1;
        const volMl = finalTotal / conc;

        const airway = calculateAirway(patient, metrics);
        const fluids = calculatePaediatricFluids(metrics, fluidProtocol, fastingHours, bloodLossMl);

        const paedEmergencies = {
          laryngospasm: {
            title: "Laryngospasm",
            steps: "Call for help; remove airway irritant/secretions; jaw thrust + CPAP with 100% O2; deepen anaesthesia with propofol (1–2 mg/kg) or suxamethonium (1–2 mg/kg IV or 4 mg/kg IM with atropine if needed).",
            drug: `Propofol 1.5 mg/kg = ${(tbw * 1.5).toFixed(1)} mg IV | Suxamethonium 1.5 mg/kg = ${(tbw * 1.5).toFixed(1)} mg IV`
          },
          bronchospasm: {
            title: "Paediatric Bronchospasm",
            steps: "100% O2, gentle bag-mask or ventilator with prolonged expiratory time, salbutamol, deepen anaesthesia, IV magnesium sulfate 40 mg/kg.",
            drug: `Magnesium Sulfate 40 mg/kg = ${Math.min(2000, Math.round(tbw * 40))} mg IV over 20 min`
          },
          anaphylaxis: {
            title: "Paediatric Anaphylaxis",
            steps: "Stop trigger, 100% O2, Adrenaline 10 mcg/kg IV (or 10 mcg/kg IM if no IV), isotonic crystalloid 20 mL/kg bolus.",
            drug: `Adrenaline 10 mcg/kg = ${(tbw * 10).toFixed(0)} mcg | Fluid 20 mL/kg = ${Math.round(tbw * 20)} mL`
          },
          postop_apnoea: {
            title: "Postoperative Apnoea (Ex-Premature / Neonate)",
            steps: "Monitor cardiorespiratory/apnoea alarm in PACU/ward for at least 12–24h (up to 50–60 wk postmenstrual age); avoid sedating opioids where regional/local analgesia suffices; caffeine citrate if indicated.",
            drug: `Patient weight ${tbw.toFixed(1)} kg · Postnatal age ${age.totalMonths} mo · Premature flag: ${patient.isPremature ? "YES" : "No"}`
          }
        };

        const activePe = paedEmergencies[paedEmKey] || paedEmergencies.laryngospasm;

        return h(
          "div",
          { className: "space-y-4" },
          // C1 Summary Banner
          h(
            Card,
            {

        const [newDrugScalar, setNewDrugScalar] = useState("TBW");

        const visibleDrugs = drugs.filter(
          (d) =>
            !dbSearch.trim() ||
            d.name.toLowerCase().includes(dbSearch.toLowerCase()) ||
            d.category.toLowerCase().includes(dbSearch.toLowerCase()) ||
            d.guideline.toLowerCase().includes(dbSearch.toLowerCase())
        );

        const handleCreateDrug = (e) => {
          e.preventDefault();
          if (!newDrugName.trim()) return;
          const id = "custom_" + Date.now();
          onAddDrug({
            id,
            name: newDrugName.trim(),
            category: "Custom Institutional Protocol",
            module: "GA",
            scalar: newDrugScalar,
            minDose: Number(newDrugDose) || 0.1,
            defaultDose: Number(newDrugDose) || 1.0,
            maxDose: (Number(newDrugDose) || 1.0) * 2,

            concentrations: [Number(newDrugConc) || 10],
            route: "IV",
            dilution: "Configured per institutional pharmacy protocol.",
            precautions: "Verify institutional concentration & clinical indication prior to administration.",

                  h(
                    "div",
                    { key: idx, className: "p-2.5 rounded-lg bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800" },
                    h(
                      "div",
                      { className: "flex items-center justify-between font-mono font-semibold" },
                      h("span", { className: "text-cyan-600 dark:text-cyan-400" }, v.version),
                      h("span", { className: "text-[11px] text-slate-500" }, v.date)
                    ),
                    h("div", { className: "text-slate-700 dark:text-slate-300 mt-0.5" }, v.summary),
                    h("div", { className: "text-[11px] text-slate-500 mt-0.5" }, v.author)
                  )
                )
              )
            )
          ),

          // Searchable Centralized Drug Database Table
          h(
            Card,
            {
              title: "Centralized Drug Database",
              subtitle: "Searchable reference entries with dosing scalars, guidelines, and verification dates",
              rightSlot: h("input", {
                type: "search",
                placeholder: "Filter database...",
                value: dbSearch,
                onChange: (e) => setDbSearch(e.target.value),
                className: "px-3 py-1.5 text-xs rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900"
              })
            },
            h(
              "div",
              { className: "overflow-x-auto text-xs" },
              h(
                "table",
                { className: "w-full text-left border-collapse" },
                h(
                  "thead",
                  { className: "border-b border-slate-200 dark:border-slate-800 text-[11px] text-slate-500" },
                  h(
                    "tr",
                    null,
                    h("th", { className: "py-2 pr-3" }, "Generic Name"),
                    h("th", { className: "py-2 px-2" }, "Category"),
                    h("th", { className: "py-2 px-2 font-mono" }, "Ref Dose"),
                    h("th", { className: "py-2 px-2 font-mono" }, "Scalar"),
                    h("th", { className: "py-2 px-2 font-mono" }, "Conc"),
                    h("th", { className: "py-2 px-2" }, "Guideline"),
                    h("th", { className: "py-2 pl-2 font-mono" }, "Verified")
                  )
                ),
                h(
                  "tbody",
                  { className: "divide-y divide-slate-200/70 dark:divide-slate-800" },
                  visibleDrugs.map((d) =>
                    h(
                      "tr",
                      { key: d.id },
                      h("td", { className: "py-2 pr-3 font-semibold" }, d.name),
                      h("td", { className: "py-2 px-2 text-slate-500" }, d.category),
                      h("td", { className: "py-2 px-2 font-mono tabular-nums" }, `${d.defaultDose} ${d.unit}`),
                      h("td", { className: "py-2 px-2 font-mono" }, d.scalar),
                      h("td", { className: "py-2 px-2 font-mono tabular-nums" }, `${d.concentrations.join("/")} ${d.outputUnit}/mL`),
                      h("td", { className: "py-2 px-2 text-slate-600 dark:text-slate-400" }, d.guideline),
                      h("td", { className: "py-2 pl-2 font-mono text-[11px]" }, d.lastVerified)
                    )
                  )
                )
              )
            )
          )
        );
      }

      // =========================================================================
      // 15. MAIN APPLICATION SHELL
      // =========================================================================
      function App() {
        const [darkMode, setDarkMode] = useState(true);
        const [activeModule, setActiveModule] = useState("GA"); // 'GA' | 'OBS' | 'PAED' | 'REG' | 'DB_TESTS'
        const [patient, setPatient] = useState(() => ({ ...DEFAULT_PATIENT }));
        const [drawerOpen, setDrawerOpen] = useState(false);
        const [emergencyOpen, setEmergencyOpen] = useState(false);
        const [drugs, setDrugs] = useState(() => [...INITIAL_DRUGS]);
        const [versionHistory, setVersionHistory] = useState(() => [...INITIAL_VERSION_HISTORY]);
        const [verifiedMap, setVerifiedMap] = useState({});
        const [testResults, setTestResults] = useState(() => runDeterministicUnitTests());
        const [toastMessage, setToastMessage] = useState("");

        useEffect(() => {
          const root = document.documentElement;
          if (darkMode) root.classList.add("dark");
          else root.classList.remove("dark");
        }, [darkMode]);

        const showToast = useCallback((msg) => {
          setToastMessage(msg);
          window.clearTimeout(window.__anaesToastTimer);
          window.__anaesToastTimer = window.setTimeout(() => setToastMessage(""), 2800);
        }, []);

        const metrics = useMemo(() => calculatePatientMetrics(patient), [patient]);

        const handleResetPatient = useCallback(() => {
          setPatient({ ...DEFAULT_PATIENT });
          setVerifiedMap({});
          showToast("Patient session reset to clean defaults.");
        }, [showToast]);

        const handleToggleVerify = useCallback(
          (key) => {
            setVerifiedMap((prev) => {
              const nextVal = !prev[key];
              showToast(nextVal ? "Calculation marked clinician-verified." : "Verification cleared.");
              return { ...prev, [key]: nextVal };
            });
          },
          [showToast]
        );

        const handleAddDrug = useCallback(
          (newDrug) => {
            setDrugs((prev) => [newDrug, ...prev]);
            setVersionHistory((prev) => [
              {
                version: `v2.4.${prev.length}`,
                date: new Date().toISOString().slice(0, 10),
                author: "Clinician / Institutional Admin",
                summary: `Added protocol for ${newDrug.name} (${newDrug.defaultDose} ${newDrug.unit}, scalar ${newDrug.scalar}).`
              },
              ...prev
            ]);
            showToast(`Added ${newDrug.name} to database.`);
          },
          [showToast]
        );

        const handleCopySummary = useCallback(() => {
          const summary = [
            `AnaesPilot Clinical Summary`,
            `Age: ${metrics.age.years}y ${metrics.age.monthsRemainder}m (${metrics.age.category}) | Sex: ${patient.sex} | ASA ${patient.asa}${patient.isEmergency ? "E" : ""}`,
            `TBW: ${metrics.tbw.toFixed(1)} kg | Ht: ${metrics.heightCm} cm | BMI: ${metrics.bmi.toFixed(1)}`,
            `Scalars: IBW ${metrics.ibw.toFixed(1)} kg, PBW ${metrics.pbw.toFixed(1)} kg, LBW ${metrics.lbw.toFixed(1)} kg, AdjBW ${metrics.adjBw.toFixed(1)} kg`,
            `Allergies: ${patient.allergies || "None documented"}`,
            metrics.flags.length ? `Flags: ${metrics.flags.join("; ")}` : "Flags: None"
          ].join("\n");

          try {
            const ta = document.createElement("textarea");
            ta.value = summary;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            showToast("Clinical summary copied to clipboard.");
          } catch (err) {
            showToast("Unable to copy summary in this browser context.");
          }
        }, [metrics, patient, showToast]);

        const navItems = [
          { id: "GA", label: "1. General Anaesthesia" },
          { id: "OBS", label: "2. Obstetric (LSCS)" },
          { id: "PAED", label: "3. Paediatric" },
          { id: "REG", label: "4. Regional" },
          { id: "DB_TESTS", label: "Drug DB, Tests & Handover" }
        ];

        return h(
          "div",
          { className: "min-h-screen flex flex-col" },
          h(PatientSummaryBar, {
            patient,
            metrics,
            onOpenPatientDrawer: () => setDrawerOpen(true),
            onResetPatient: handleResetPatient,
            onOpenEmergency: () => setEmergencyOpen(true),
            darkMode,
            onToggleTheme: () => setDarkMode((d) => !d),
            onCopySummary: handleCopySummary
          }),

          // Toast notification banner (never uses alert())
          toastMessage &&
            h(
              "div",
              {
                className:
                  "fixed bottom-4 right-4 z-50 px-4 py-2.5 rounded-xl bg-cyan-600 text-white text-xs font-semibold shadow-lg no-print"
              },
              toastMessage
            ),

          // Primary Module Navigation
          h(
            "nav",
            {
              className:
                "border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-[#111827] px-3 sm:px-5 no-print"
            },
            h(
              "div",
              { className: "max-w-[1440px] mx-auto flex items-center gap-1.5 overflow-x-auto py-2" },
              navItems.map((item) =>
                h(
                  "button",
                  {
                    key: item.id,
                    type: "button",
                    onClick: () => setActiveModule(item.id),
                    className: `px-3.5 py-2 rounded-lg text-xs font-semibold whitespace-nowrap transition ${
                      activeModule === item.id
                        ? "bg-cyan-500/20 text-cyan-700 dark:text-cyan-300 border border-cyan-500/40"
                        : "text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60"
                    }`
                  },
                  item.label
                )
              )
            )
          ),

          // Main Workspace Container
          h(
            "main",
            { className: "flex-1 max-w-[1440px] w-full mx-auto px-3 sm:px-5 py-4 space-y-4" },
            activeModule === "GA" &&
              h(GeneralAnaesthesiaModule, {
                drugs,
                metrics,
                verifiedMap,
                onToggleVerify: handleToggleVerify
              }),
            activeModule === "OBS" &&
              h(ObstetricAnaesthesiaModule, {
                patient,
                onChangePatient: setPatient,
                metrics,
                verifiedMap,
                onToggleVerify: handleToggleVerify,
                onOpenEmergency: () => setEmergencyOpen(true)
              }),
            activeModule === "PAED" &&
              h(PaediatricAnaesthesiaModule, {
                drugs,
                patient,
                onChangePatient: setPatient,
                metrics,
                verifiedMap,
                onToggleVerify: handleToggleVerify,
                onOpenEmergency: () => setEmergencyOpen(true)
              }),
            activeModule === "REG" &&
              h(RegionalAnaesthesiaModule, {
                metrics,
                verifiedMap,
                onToggleVerify: handleToggleVerify,
                onOpenEmergency: () => setEmergencyOpen(true)
              }),
            activeModule === "DB_TESTS" &&
              h(DatabaseAndTestsModule, {
                drugs,
                onAddDrug: handleAddDrug,
                versionHistory,
                testResults,
                onRerunTests: () => {
                  const res = runDeterministicUnitTests();
                  setTestResults(res);
                  showToast(`Unit tests completed: ${res.filter((r) => r.passed).length}/${res.length} passed.`);
                },
                verifiedMap,
                metrics,
                onCopySummary: handleCopySummary
              })
          ),

          // Drawers & Modals
          h(PatientParameterDrawer, {
            open: drawerOpen,
            onClose: () => setDrawerOpen(false),
            patient,
            onChangePatient: setPatient,
            metrics,
            onResetPatient: handleResetPatient
          }),

          h(EmergencyQuickAccessModal, {
            open: emergencyOpen,
            onClose: () => setEmergencyOpen(false),
            patient,
            metrics
          })
        );
      }

      const rootEl = document.getElementById("app");
      ReactDOM.createRoot(rootEl).render(h(App));
    })();
  </script>
</body>
</html>
